<h2>这个工具主要给谁使用？</h2>
<p class="subtitle">选择目标用户</p>

<div class="options">
  <div class="option" data-choice="personal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>个人使用</h3>
      <p>自己处理字幕，简单实用即可</p>
    </div>
  </div>
  <div class="option" data-choice="professional" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>专业字幕组</h3>
      <p>需要高效批量处理，支持团队协作</p>
    </div>
  </div>
  <div class="option" data-choice="creator" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>视频创作者</h3>
      <p>需要快速制作和调整字幕，对样式有一定要求</p>
    </div>
  </div>
  <div class="option selected" data-choice="enthusiast" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>字幕爱好者/开源贡献者 ✓</h3>
      <p>功能全面，可扩展</p>
    </div>
  </div>
</div>
