<h2>你希望这个工具是什么类型的应用？</h2>
<p class="subtitle">选择应用类型</p>

<div class="options">
  <div class="option selected" data-choice="web" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Web 应用 ✓</h3>
      <p>浏览器中运行，跨平台，无需安装</p>
    </div>
  </div>
  <div class="option" data-choice="desktop" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>桌面应用</h3>
      <p>本地运行，更好的文件访问和性能</p>
    </div>
  </div>
  <div class="option" data-choice="electron" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Electron 应用</h3>
      <p>跨平台桌面应用，结合 Web 技术和本地能力</p>
    </div>
  </div>
</div>
