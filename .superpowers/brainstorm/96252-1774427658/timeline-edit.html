<h2>时间轴编辑的交互方式你更偏好哪种？</h2>
<p class="subtitle">这是字幕编辑器的核心交互</p>

<div class="options">
  <div class="option" data-choice="timeline" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>时间轴视图</h3>
      <p>类似视频编辑软件的可视化时间轴，可拖拽调整字幕块</p>
    </div>
  </div>
  <div class="option" data-choice="table" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>列表/表格视图</h3>
      <p>传统字幕编辑方式，以列表形式展示，直接编辑时间码</p>
    </div>
  </div>
  <div class="option" data-choice="both" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>两者都要</h3>
      <p>可切换或同时显示，满足不同场景需求</p>
    </div>
  </div>
</div>
