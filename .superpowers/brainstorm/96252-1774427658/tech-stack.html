<h2>你偏好哪种前端技术栈？</h2>
<p class="subtitle">选择技术栈</p>

<div class="options">
  <div class="option" data-choice="react" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>React</h3>
      <p>生态丰富，社区活跃</p>
    </div>
  </div>
  <div class="option selected" data-choice="vue" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Vue ✓</h3>
      <p>轻量灵活，上手容易</p>
    </div>
  </div>
  <div class="option" data-choice="svelte" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Svelte</h3>
      <p>编译时优化，性能优秀，代码简洁</p>
    </div>
  </div>
  <div class="option" data-choice="none" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>无偏好</h3>
      <p>让我根据项目需求推荐</p>
    </div>
  </div>
</div>
